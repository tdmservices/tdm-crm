# Fly.io: `fly launch --copy-config --no-deploy` then `fly volumes create tdm_data --size 1` then `fly deploy`.
app = "tdm-crm"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/tdm.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "tdm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
